[package]
name = "adbrent"
version = "0.2.0"
edition = "2021"
description = "A rental desk for Android devices shared between AI agents over adb"
license = "MIT"
readme = "README.md"
repository = "https://github.com/iammosab/adbrent"
keywords = ["adb", "android", "agents", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
