[package]
name = "adbrent"
version = "0.2.0"
edition = "2021"
description = "One Android device per AI agent: an adb device lock for parallel Claude Code, Codex and other agent sessions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/iammosab/adbrent"
keywords = ["adb", "android", "ai-agents", "claude-code", "device-lock"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
