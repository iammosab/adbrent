[package]
name = "adbrent"
version = "0.3.3"
edition = "2021"
description = "One Android device per AI agent: an adb device lock for parallel Claude Code and other coding-agent sessions"
license = "MIT"
readme = "README.md"
exclude = ["assets/", "docs/"]
repository = "https://github.com/iammosab/adbrent"
homepage = "https://iammosab.github.io/adbrent/"
keywords = ["adb", "android", "ai-agents", "claude-code", "device-lock"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
